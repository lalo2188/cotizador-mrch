            <div style={{ display: "flex", gap: 8, alignItems: "center" }}>
              <span className="cz-m" style={{ fontWeight: 700 }}>{fmt(h.total)}</span>
              <button className="cz-btn" style={{ padding: "6px 10px" }} onClick={() => setAbierto(abierto === h.id ? null : h.id)}>{abierto === h.id ? "Ocultar" : "Ver"}</button>
              <button onClick={() => onEliminar(h.id)} style={{ border: "none", background: "none", color: "#C0392B", cursor: "pointer", fontSize: 18 }}>×</button>
            </div>
          </div>
          {abierto === h.id && <pre style={{ marginTop: 10, background: "#F6F7F9", padding: 10, borderRadius: 8, fontSize: 12, whiteSpace: "pre-wrap" }}>{h.texto}</pre>}
        </div>
      ))}
    </div>
  );
}

/* ===================== FAVORITO + IMAGEN (reutilizable en Insumos) ===================== */
function FavImg({ favorito, imagen, onToggleFav, onSubirImagen, onQuitarImagen, size }) {
  const s = size || 28;
  return (
    <div style={{ display: "flex", alignItems: "center", gap: 4 }}>
      <button onClick={onToggleFav} title="Marcar/quitar favorito" style={{ border: "none", background: "none", cursor: "pointer", fontSize: 16, color: favorito ? "#F4B400" : "#D8DBE0", lineHeight: 1 }}>{favorito ? "★" : "☆"}</button>
      <label style={{ cursor: "pointer" }} title="Subir imagen">
        {imagen
          ? <img src={imagen} style={{ width: s, height: s, objectFit: "cover", borderRadius: 5, border: "1px solid #D8DBE0", display: "block" }} />
          : <span style={{ width: s, height: s, display: "flex", alignItems: "center", justifyContent: "center", border: "1px dashed #D8DBE0", borderRadius: 5, fontSize: 12, color: "#9AA0AE" }}>📷</span>}
        <input type="file" accept="image/*" style={{ display: "none" }} onChange={(e) => onSubirImagen(e.target.files[0])} />
      </label>
      {imagen && onQuitarImagen && <button onClick={onQuitarImagen} title="Quitar imagen" style={{ border: "none", background: "none", color: "#C0392B", cursor: "pointer", fontSize: 12 }}>×</button>}
    </div>
  );
}

function CalcLote({ unidad, onAplicar }) {
  const [open, setOpen] = useState(false);
  const [piezas, setPiezas] = useState("");
  const [total, setTotal] = useState("");
  const resultado = Number(piezas) > 0 && Number(total) >= 0 ? Number(total) / Number(piezas) : null;
  const cerrar = () => { setOpen(false); setPiezas(""); setTotal(""); };
  if (!open) return <button onClick={() => setOpen(true)} title="Calcular costo unitario a partir de un lote comprado" style={{ border: "none", background: "none", color: "#F4561D", cursor: "pointer", fontSize: 11, whiteSpace: "nowrap", padding: 0 }}>🧮 Por lote</button>;
  return (
    <span style={{ display: "flex", gap: 4, alignItems: "center", flexWrap: "wrap", background: "#FFF4EE", border: "1px dashed #F4A26155", borderRadius: 6, padding: "4px 6px" }}>
      <input className="cz-in" style={{ width: 62, padding: "4px 6px", fontSize: 11 }} type="number" placeholder={"pz"} autoFocus value={piezas} onChange={(e) => setPiezas(e.target.value)} />
      <span style={{ fontSize: 11, color: "#7B8290" }}>por $</span>
      <input className="cz-in" style={{ width: 72, padding: "4px 6px", fontSize: 11 }} type="number" placeholder="total" value={total} onChange={(e) => setTotal(e.target.value)} onKeyDown={(e) => { if (e.key === "Enter" && resultado != null) { onAplicar(resultado); cerrar(); } if (e.key === "Escape") cerrar(); }} />
      {resultado != null && <span style={{ fontSize: 11, color: "#2EA84F", fontWeight: 600 }}>= {fmt(resultado)}/{unidad || "u"}</span>}
      <button className="cz-btn org" style={{ padding: "4px 8px", fontSize: 11 }} disabled={resultado == null} onClick={() => { onAplicar(resultado); cerrar(); }}>Aplicar</button>
      <button onClick={cerrar} style={{ border: "none", background: "none", color: "#7B8290", cursor: "pointer", fontSize: 11 }}>Cancelar</button>
    </span>
  );
}

function ColorVariantes({ colores, onAgregar, onQuitar }) {
  const [open, setOpen] = useState(false);
  const [nombre, setNombre] = useState("");
  const [hex, setHex] = useState("#F4561D");
  const [imagen, setImagen] = useState("");

  const subirImagen = (file) => {
    if (!file) return;
    redimensionarImagen(file, 80, (dataUrl) => setImagen(dataUrl));
  };

  const cerrar = () => { setOpen(false); setNombre(""); setHex("#F4561D"); setImagen(""); };

  const agregar = () => {
    if (!nombre.trim()) { alert('Ponle un nombre al color (ej. "Azul marino")'); return; }
    onAgregar({ id: nid(), nombre: nombre.trim(), hex, imagen });
    cerrar();
  };

  return (
    <div style={{ display: "flex", gap: 4, alignItems: "center", flexWrap: "wrap", marginTop: 6 }}>
      {colores.map((c) => (
        <span key={c.id} title={c.nombre} style={{ display: "inline-flex", alignItems: "center", gap: 3, background: "#F5F6F8", borderRadius: 20, padding: "2px 6px 2px 2px" }}>
          {c.imagen
            ? <img src={c.imagen} style={{ width: 16, height: 16, borderRadius: "50%", objectFit: "cover" }} />
            : <span style={{ width: 16, height: 16, borderRadius: "50%", background: c.hex || "#ccc", display: "inline-block", border: "1px solid #D8DBE0" }} />}
          <span style={{ fontSize: 10, color: "#5B6270" }}>{c.nombre}</span>
          <button onClick={() => onQuitar(c.id)} style={{ border: "none", background: "none", color: "#C0392B", cursor: "pointer", fontSize: 12, lineHeight: 1, padding: 0 }}>×</button>
        </span>
      ))}
      {!open && <button onClick={() => setOpen(true)} style={{ border: "1px dashed #D8DBE0", background: "none", borderRadius: 20, padding: "2px 8px", fontSize: 10, color: "#7B8290", cursor: "pointer" }}>+ color</button>}
      {open && (
        <span style={{ display: "flex", gap: 4, alignItems: "center", background: "#FFF4EE", border: "1px dashed #F4A26155", borderRadius: 6, padding: "4px 6px" }}>
          <input className="cz-in" style={{ width: 92, padding: "3px 6px", fontSize: 11 }} placeholder="Ej. Azul marino" value={nombre} onChange={(e) => setNombre(e.target.value)} autoFocus />
          <input type="color" value={hex} onChange={(e) => setHex(e.target.value)} title="Color aproximado" style={{ width: 24, height: 24, border: "none", padding: 0, cursor: "pointer", background: "none" }} />
          <label style={{ cursor: "pointer", fontSize: 14 }} title="Foto (opcional)">
            {imagen ? <img src={imagen} style={{ width: 20, height: 20, borderRadius: "50%", objectFit: "cover" }} /> : "📷"}
            <input type="file" accept="image/*" style={{ display: "none" }} onChange={(e) => subirImagen(e.target.files[0])} />
          </label>
          <button className="cz-btn org" style={{ padding: "3px 8px", fontSize: 11 }} onClick={agregar}>Agregar</button>
          <button onClick={cerrar} style={{ border: "none", background: "none", color: "#7B8290", cursor: "pointer", fontSize: 11 }}>Cancelar</button>
        </span>
      )}
    </div>
  );
}

/* ===================== VISTA INSUMOS ===================== */
function VistaInsumos({ materiales, setMateriales, preciosFijos, setPreciosFijos, configProduccion, setConfigProduccion, costosOperativos, setCostosOperativos, costoMaquinas, setCostoMaquinas, manoObra, setManoObra, costosPorHora, catalogoOtros, setCatalogoOtros }) {
  const [categoriaActiva, setCategoriaActiva] = useState("laser");
  const [importText, setImportText] = useState("");
  const [importMsg, setImportMsg] = useState("");
  const [busqueda, setBusqueda] = useState("");
  const CATEGORIAS = [
    ["laser", "🔥 Láser"], ["dtf", "👕 DTF"], ["sublimado", "☕ Sublimado"], ["uv", "✨ DTF UV"], ["filamento3d", "🧵 Filamento 3D"], ["empaque", "📦 Empaque"],
  ];

  const actualizarMaterial = (cat, id, campo, valor) => {
    setMateriales((prev) => ({ ...prev, [cat]: prev[cat].map((m) => (m.id === id ? { ...m, [campo]: campo === "nombre" ? valor : Number(valor), mod: hoy() } : m)) }));
  };
  const eliminarMaterial = (cat, id) => {
    setMateriales((prev) => ({ ...prev, [cat]: prev[cat].filter((m) => m.id !== id) }));
  };
  const agregarMaterial = (cat) => {
    const nombre = prompt("Nombre del nuevo insumo:");
    if (!nombre) return;
    const extra = cat === "uv" || cat === "sublimado" ? { w: 10, h: 10 } : {};
    setMateriales((prev) => ({ ...prev, [cat]: [...prev[cat], { id: nid(), nombre, precio: 0, unidad: "pieza", ...extra, mod: hoy() }] }));
  };
  const actualizarTierColor = (id, colorIdx, campo, valor) => {
    setMateriales((prev) => ({ ...prev, dtf: prev.dtf.map((m) => (m.id === id ? { ...m, colores: m.colores.map((c, i) => (i === colorIdx ? { ...c, [campo]: campo === "nombre" ? valor : Number(valor) } : c)), mod: hoy() } : m)) }));
  };
  const importarCatalogo = () => {
    try {
      const arr = JSON.parse(importText);
      if (!Array.isArray(arr)) throw new Error("debe ser un arreglo JSON");
      setMateriales((prev) => {
        const existentes = prev.dtf.filter((m) => !arr.some((n) => n.id === m.id));
        const nuevos = arr.map((n) => ({ ...n, mod: hoy() }));
        return { ...prev, dtf: [...existentes, ...nuevos] };
      });
      setImportMsg(`✅ Importados/actualizados ${arr.length} artículo(s).`);
      setImportText("");
    } catch (e) {
      setImportMsg("❌ JSON inválido: " + e.message);
    }
  };
  const exportarCatalogo = () => {
    navigator.clipboard.writeText(JSON.stringify(materiales.dtf, null, 2));
    setImportMsg("📋 Catálogo copiado al portapapeles.");
  };
  const actualizarOtro = (sub, id, valor) => {
    setCatalogoOtros((prev) => ({ ...prev, [sub]: prev[sub].map((o) => (o.id === id ? { ...o, precio: Number(valor), mod: hoy() } : o)) }));
  };
  const toggleFavorito = (cat, id) => {
    setMateriales((prev) => ({ ...prev, [cat]: prev[cat].map((m) => (m.id === id ? { ...m, favorito: !m.favorito, mod: hoy() } : m)) }));
  };
  const subirImagen = (cat, id, file) => {
    if (!file) return;
    redimensionarImagen(file, 240, (dataUrl) => {
      setMateriales((prev) => ({ ...prev, [cat]: prev[cat].map((m) => (m.id === id ? { ...m, imagen: dataUrl, mod: hoy() } : m)) }));
    });
  };
  const quitarImagen = (cat, id) => {
    setMateriales((prev) => ({ ...prev, [cat]: prev[cat].map((m) => (m.id === id ? { ...m, imagen: "" } : m)) }));
  };
  const agregarColorMaterial = (cat, id, color) => {
    setMateriales((prev) => ({ ...prev, [cat]: prev[cat].map((m) => (m.id === id ? { ...m, variantes: [...(m.variantes || []), color], mod: hoy() } : m)) }));
  };
  const quitarColorMaterial = (cat, id, colorId) => {
    setMateriales((prev) => ({ ...prev, [cat]: prev[cat].map((m) => (m.id === id ? { ...m, variantes: (m.variantes || []).filter((c) => c.id !== colorId), mod: hoy() } : m)) }));
  };
  const toggleFavoritoOtro = (sub, id) => {
    setCatalogoOtros((prev) => ({ ...prev, [sub]: prev[sub].map((o) => (o.id === id ? { ...o, favorito: !o.favorito, mod: hoy() } : o)) }));
  };
  const subirImagenOtro = (sub, id, file) => {
    if (!file) return;
    redimensionarImagen(file, 160, (dataUrl) => {
      setCatalogoOtros((prev) => ({ ...prev, [sub]: prev[sub].map((o) => (o.id === id ? { ...o, imagen: dataUrl, mod: hoy() } : o)) }));
    });
  };
  const agregarColorOtro = (sub, id, color) => {
    setCatalogoOtros((prev) => ({ ...prev, [sub]: prev[sub].map((o) => (o.id === id ? { ...o, colores: [...(o.colores || []), color], mod: hoy() } : o)) }));
  };
  const quitarColorOtro = (sub, id, colorId) => {
    setCatalogoOtros((prev) => ({ ...prev, [sub]: prev[sub].map((o) => (o.id === id ? { ...o, colores: (o.colores || []).filter((c) => c.id !== colorId), mod: hoy() } : o)) }));
  };

  const actualizarCortador = (id, campo, valor) => {
    setPreciosFijos((prev) => ({ ...prev, cortadores: prev.cortadores.map((c) => (c.id === id ? { ...c, [campo]: campo === "rango" ? valor : (valor === "" ? null : Number(valor)), mod: hoy() } : c)) }));
  };
  const actualizarPin = (id, campo, valor) => {
    setPreciosFijos((prev) => ({ ...prev, pines: prev.pines.map((p) => (p.id === id ? { ...p, [campo]: campo === "rango" ? valor : Number(valor), mod: hoy() } : p)) }));
  };
  const actualizarTote = (id, campo, valor) => {
    setPreciosFijos((prev) => ({ ...prev, totebags: prev.totebags.map((t) => (t.id === id ? { ...t, [campo]: campo === "rango" ? valor : Number(valor), mod: hoy() } : t)) }));
  };

  const editarProduccion = (campo, valor) => setConfigProduccion((prev) => ({ ...prev, [campo]: Number(valor), mod: hoy() }));
  const editarOperativos = (campo, valor) => setCostosOperativos((prev) => ({ ...prev, [campo]: Number(valor), mod: hoy() }));
  const editarMaquinas = (campo, valor) => setCostoMaquinas((prev) => ({ ...prev, [campo]: Number(valor), mod: hoy() }));
  const editarManoObra = (campo, valor) => setManoObra((prev) => ({ ...prev, [campo]: Number(valor), mod: hoy() }));

  const totalOperativoMensual = costosOperativos.renta + costosOperativos.luz + costosOperativos.agua + costosOperativos.internet + costosOperativos.gasolina;

  return (
    <div style={{ maxWidth: 860, display: "flex", flexDirection: "column", gap: 14 }}>
      <div className="cz-card">
        <span className="cz-d" style={{ fontSize: 20, fontWeight: 700, textTransform: "uppercase" }}>Materiales</span>
        <div style={{ display: "flex", gap: 6, marginTop: 10, flexWrap: "wrap" }}>
          {CATEGORIAS.map(([k, t]) => (
            <button key={k} className={"svc" + (categoriaActiva === k ? " on" : "")} style={categoriaActiva === k ? { background: "#14161D" } : {}} onClick={() => setCategoriaActiva(k)}>{t}</button>
          ))}
        </div>
        <div style={{ display: "flex", gap: 8, alignItems: "center", marginTop: 10 }}>
          <input className="cz-in" style={{ flex: 1 }} placeholder="🔎 Buscar por nombre…" value={busqueda} onChange={(e) => setBusqueda(e.target.value)} />
          {busqueda && <button className="cz-btn" onClick={() => setBusqueda("")}>Limpiar</button>}
        </div>
        <div style={{ marginTop: 14, display: "flex", flexDirection: "column", gap: 8 }}>
          {categoriaActiva === "dtf" ? (
            Object.entries(
              materiales.dtf
                .filter((m) => m.nombre.toLowerCase().includes(busqueda.toLowerCase()))
                .reduce((g, m) => { const cat = m.categoria || "Otros"; (g[cat] = g[cat] || []).push(m); return g; }, {})
            ).map(([cat, items]) => (
              <div key={cat}>
                <div style={{ fontSize: 11, fontWeight: 700, color: "#7B8290", textTransform: "uppercase", letterSpacing: ".05em", margin: "6px 0" }}>{cat}</div>
                {items.map((m) => m.tipo === "escalonado" ? (
                  <div key={m.id} style={{ border: "1.5px solid #EEF0F2", borderRadius: 8, padding: 8, marginBottom: 8 }}>
                    <div style={{ display: "flex", alignItems: "center", gap: 6 }}>
                      <FavImg favorito={m.favorito} imagen={m.imagen} onToggleFav={() => toggleFavorito("dtf", m.id)} onSubirImagen={(f) => subirImagen("dtf", m.id, f)} onQuitarImagen={() => quitarImagen("dtf", m.id)} />
                      <input className="cz-in" style={{ flex: 1, fontWeight: 600 }} value={m.nombre} onChange={(e) => actualizarMaterial("dtf", m.id, "nombre", e.target.value)} />
                      <span className="insumo-mod">Mod: {m.mod}</span>
                      <button onClick={() => eliminarMaterial("dtf", m.id)} style={{ border: "none", background: "none", color: "#C0392B", cursor: "pointer", fontSize: 16 }}>×</button>
                    </div>
                    <div style={{ display: "grid", gridTemplateColumns: "1.2fr 1fr 1fr 1fr", gap: 6, marginTop: 6 }}>
                      <div></div><div style={{ fontSize: 10, color: "#7B8290" }}>12–71pz</div><div style={{ fontSize: 10, color: "#7B8290" }}>72–503pz</div><div style={{ fontSize: 10, color: "#7B8290" }}>504+pz</div>
                      {m.colores.map((c, ci) => (
                        <React.Fragment key={ci}>
                          <input className="cz-in" style={{ fontSize: 12, padding: "5px 6px" }} value={c.nombre} onChange={(e) => actualizarTierColor(m.id, ci, "nombre", e.target.value)} />
                          <input className="cz-in" style={{ fontSize: 12, padding: "5px 6px" }} type="number" value={c.t1} onChange={(e) => actualizarTierColor(m.id, ci, "t1", e.target.value)} />
                          <input className="cz-in" style={{ fontSize: 12, padding: "5px 6px" }} type="number" value={c.t2} onChange={(e) => actualizarTierColor(m.id, ci, "t2", e.target.value)} />
                          <input className="cz-in" style={{ fontSize: 12, padding: "5px 6px" }} type="number" value={c.t3} onChange={(e) => actualizarTierColor(m.id, ci, "t3", e.target.value)} />
                        </React.Fragment>
                      ))}
                    </div>
                    <ColorVariantes colores={m.variantes || []} onAgregar={(c) => agregarColorMaterial("dtf", m.id, c)} onQuitar={(cid) => quitarColorMaterial("dtf", m.id, cid)} />
                  </div>
                ) : (
                  <div key={m.id} style={{ border: "1.5px solid #EEF0F2", borderRadius: 8, padding: 8, marginBottom: 8 }}>
                    <div className="insumo-row" style={{ border: "none", padding: 0 }}>
                      <FavImg favorito={m.favorito} imagen={m.imagen} onToggleFav={() => toggleFavorito("dtf", m.id)} onSubirImagen={(f) => subirImagen("dtf", m.id, f)} onQuitarImagen={() => quitarImagen("dtf", m.id)} />
                      <input className="cz-in" style={{ flex: 2, minWidth: 140 }} value={m.nombre} onChange={(e) => actualizarMaterial("dtf", m.id, "nombre", e.target.value)} />
                      <input className="cz-in" style={{ flex: 1, minWidth: 80 }} type="number" value={m.precio} onChange={(e) => actualizarMaterial("dtf", m.id, "precio", e.target.value)} />
                      <CalcLote unidad={m.unidad} onAplicar={(v) => actualizarMaterial("dtf", m.id, "precio", v)} />
                      <span className="insumo-mod">Mod: {m.mod}</span>
                      <button onClick={() => eliminarMaterial("dtf", m.id)} style={{ border: "none", background: "none", color: "#C0392B", cursor: "pointer", fontSize: 16 }}>×</button>
                    </div>
                    <ColorVariantes colores={m.variantes || []} onAgregar={(c) => agregarColorMaterial("dtf", m.id, c)} onQuitar={(cid) => quitarColorMaterial("dtf", m.id, cid)} />
                  </div>
                ))}
              </div>
            ))
          ) : (
            materiales[categoriaActiva].filter((m) => m.nombre.toLowerCase().includes(busqueda.toLowerCase())).map((m) => (
              <div key={m.id} style={{ border: "1.5px solid #EEF0F2", borderRadius: 8, padding: 8, marginBottom: 8 }}>
                <div className="insumo-row" style={{ border: "none", padding: 0 }}>
                  <FavImg favorito={m.favorito} imagen={m.imagen} onToggleFav={() => toggleFavorito(categoriaActiva, m.id)} onSubirImagen={(f) => subirImagen(categoriaActiva, m.id, f)} onQuitarImagen={() => quitarImagen(categoriaActiva, m.id)} />
                  <input className="cz-in" style={{ flex: 2, minWidth: 140 }} value={m.nombre} onChange={(e) => actualizarMaterial(categoriaActiva, m.id, "nombre", e.target.value)} />
                  <input className="cz-in" style={{ flex: 1, minWidth: 80 }} type="number" value={m.precio} onChange={(e) => actualizarMaterial(categoriaActiva, m.id, "precio", e.target.value)} />
                  {m.w !== undefined && <input className="cz-in" style={{ width: 60 }} type="number" title="Ancho cm" value={m.w} onChange={(e) => actualizarMaterial(categoriaActiva, m.id, "w", e.target.value)} />}
                  {m.h !== undefined && <input className="cz-in" style={{ width: 60 }} type="number" title="Alto cm" value={m.h} onChange={(e) => actualizarMaterial(categoriaActiva, m.id, "h", e.target.value)} />}
                  <CalcLote unidad={m.unidad} onAplicar={(v) => actualizarMaterial(categoriaActiva, m.id, "precio", v)} />
                  <span className="insumo-mod">Mod: {m.mod}</span>
                  <button onClick={() => eliminarMaterial(categoriaActiva, m.id)} style={{ border: "none", background: "none", color: "#C0392B", cursor: "pointer", fontSize: 16 }}>×</button>
                </div>
                <ColorVariantes colores={m.variantes || []} onAgregar={(c) => agregarColorMaterial(categoriaActiva, m.id, c)} onQuitar={(cid) => quitarColorMaterial(categoriaActiva, m.id, cid)} />
              </div>
            ))
          )}
        </div>
        <button className="cz-btn" style={{ marginTop: 10 }} onClick={() => agregarMaterial(categoriaActiva)}>+ Agregar insumo</button>
        {categoriaActiva === "dtf" && (
          <div style={{ marginTop: 14, borderTop: "1px dashed #D8DBE0", paddingTop: 12 }}>
            <label className="cz-lbl">Importar catálogo (JSON) — pega aquí lo que te dé Claude al leer un PDF de precios nuevo</label>
            <textarea className="cz-in" style={{ minHeight: 70, fontFamily: "'IBM Plex Mono',monospace", fontSize: 11 }} value={importText} onChange={(e) => setImportText(e.target.value)} placeholder='[{"id":"32702","tipo":"escalonado","categoria":"Playeras Caballero","nombre":"32702 Prime...","colores":[{"nombre":"Blanco","t1":33,"t2":32.34,"t3":31.35}]}]' />
            <div style={{ display: "flex", gap: 8, marginTop: 6 }}>
              <button className="cz-btn org" onClick={importarCatalogo}>Importar / actualizar</button>
              <button className="cz-btn" onClick={exportarCatalogo}>Exportar catálogo actual</button>
            </div>
            {importMsg && <div style={{ fontSize: 12, marginTop: 6 }}>{importMsg}</div>}
            <div style={{ fontSize: 11, color: "#7B8290", marginTop: 6 }}>Los precios se guardan "sin IVA" tal como los da el proveedor — el IVA se aplica automático al cotizar (ver "IVA textil" en Config de producción).</div>
          </div>
        )}
      </div>

      <div className="cz-card">
        <span className="cz-d" style={{ fontSize: 18, fontWeight: 700, textTransform: "uppercase" }}>Precios fijos — Cortadores de galleta</span>
        <div style={{ marginTop: 12, display: "flex", flexDirection: "column", gap: 8 }}>
          {preciosFijos.cortadores.map((c) => (
            <div key={c.id} className="insumo-row">
              <input className="cz-in" style={{ flex: 1, minWidth: 90 }} value={c.rango} onChange={(e) => actualizarCortador(c.id, "rango", e.target.value)} />
              <div style={{ flex: 1, minWidth: 90 }}><label className="cz-lbl" style={{ margin: 0 }}>Precio +sello</label><input className="cz-in" type="number" value={c.base} onChange={(e) => actualizarCortador(c.id, "base", e.target.value)} /></div>
              <div style={{ flex: 1, minWidth: 90 }}><label className="cz-lbl" style={{ margin: 0 }}>Desde (pz)</label><input className="cz-in" type="number" value={c.descMin === null ? "" : c.descMin} onChange={(e) => actualizarCortador(c.id, "descMin", e.target.value)} /></div>
              <div style={{ flex: 1, minWidth: 90 }}><label className="cz-lbl" style={{ margin: 0 }}>Precio volumen</label><input className="cz-in" type="number" value={c.descPrecio === null ? "" : c.descPrecio} onChange={(e) => actualizarCortador(c.id, "descPrecio", e.target.value)} /></div>
              <span className="insumo-mod">Mod: {c.mod}</span>
            </div>
          ))}
        </div>
      </div>

      <div className="cz-card">
        <span className="cz-d" style={{ fontSize: 18, fontWeight: 700, textTransform: "uppercase" }}>Precios fijos — Pines</span>
        <div style={{ marginTop: 12, display: "flex", flexDirection: "column", gap: 8 }}>
          {preciosFijos.pines.map((p) => (
            <div key={p.id} className="insumo-row">
              <input className="cz-in" style={{ flex: 1, minWidth: 90 }} value={p.rango} onChange={(e) => actualizarPin(p.id, "rango", e.target.value)} />
              <div style={{ flex: 1, minWidth: 90 }}><label className="cz-lbl" style={{ margin: 0 }}>Desde (pz)</label><input className="cz-in" type="number" value={p.min} onChange={(e) => actualizarPin(p.id, "min", e.target.value)} /></div>
              <div style={{ flex: 1, minWidth: 90 }}><label className="cz-lbl" style={{ margin: 0 }}>Precio c/u</label><input className="cz-in" type="number" value={p.precioPz} onChange={(e) => actualizarPin(p.id, "precioPz", e.target.value)} /></div>
              <CalcLote unidad="pieza" onAplicar={(v) => actualizarPin(p.id, "precioPz", v)} />
              <span className="insumo-mod">Mod: {p.mod}</span>
            </div>
          ))}
        </div>
      </div>

      <div className="cz-card">
        <span className="cz-d" style={{ fontSize: 18, fontWeight: 700, textTransform: "uppercase" }}>Precios fijos — Totebags</span>
        <div style={{ fontSize: 11, color: "#7B8290", marginTop: 4 }}>Costo por volumen (bolsa + 1 diseño DTF máx. 35×36cm). El precio de venta lo calcula el cotizador automático según el tipo de cliente (igual que el resto del catálogo).</div>
        <div style={{ marginTop: 12, display: "flex", flexDirection: "column", gap: 8 }}>
          {preciosFijos.totebags.map((t) => (
            <div key={t.id} className="insumo-row">
              <input className="cz-in" style={{ flex: 1, minWidth: 90 }} value={t.rango} onChange={(e) => actualizarTote(t.id, "rango", e.target.value)} />
              <div style={{ flex: 1, minWidth: 90 }}><label className="cz-lbl" style={{ margin: 0 }}>Desde (pz)</label><input className="cz-in" type="number" value={t.min} onChange={(e) => actualizarTote(t.id, "min", e.target.value)} /></div>
              <div style={{ flex: 1, minWidth: 90 }}><label className="cz-lbl" style={{ margin: 0 }}>Costo c/u</label><input className="cz-in" type="number" value={t.costoPz} onChange={(e) => actualizarTote(t.id, "costoPz", e.target.value)} /></div>
              <span className="insumo-mod">Mod: {t.mod}</span>
            </div>
          ))}
        </div>
      </div>

      <div className="cz-card">
        <span className="cz-d" style={{ fontSize: 18, fontWeight: 700, textTransform: "uppercase" }}>Config de producción</span>
        <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr 1fr", gap: 8, marginTop: 10 }}>
          <div><label className="cz-lbl">DTF $/metro</label><input className="cz-in" type="number" value={configProduccion.dtfPrecioMetro} onChange={(e) => editarProduccion("dtfPrecioMetro", e.target.value)} /></div>
          <div><label className="cz-lbl">DTF ancho rollo (cm)</label><input className="cz-in" type="number" value={configProduccion.dtfAnchoCm} onChange={(e) => editarProduccion("dtfAnchoCm", e.target.value)} /></div>
          <div><label className="cz-lbl">Tiempo planchado (min)</label><input className="cz-in" type="number" value={configProduccion.tiempoPlanchadoMin} onChange={(e) => editarProduccion("tiempoPlanchadoMin", e.target.value)} /></div>
          <div><label className="cz-lbl">DTF Suelto $/metro (lotes compartidos)</label><input className="cz-in" type="number" value={configProduccion.dtfSueltoPrecioMetro} onChange={(e) => editarProduccion("dtfSueltoPrecioMetro", e.target.value)} /></div>
          <div><label className="cz-lbl">DTF Suelto ancho rollo (cm)</label><input className="cz-in" type="number" value={configProduccion.dtfSueltoAnchoCm} onChange={(e) => editarProduccion("dtfSueltoAnchoCm", e.target.value)} /></div>
          <div><label className="cz-lbl">DTF UV film $/metro</label><input className="cz-in" type="number" value={configProduccion.uvPrecioMetro} onChange={(e) => editarProduccion("uvPrecioMetro", e.target.value)} /></div>
          <div><label className="cz-lbl">DTF UV ancho rollo (cm)</label><input className="cz-in" type="number" value={configProduccion.uvAnchoCm} onChange={(e) => editarProduccion("uvAnchoCm", e.target.value)} /></div>
          <div><label className="cz-lbl">Diseño/revisión DTF ($, único x pedido)</label><input className="cz-in" type="number" value={configProduccion.manipProporc} onChange={(e) => editarProduccion("manipProporc", e.target.value)} /></div>
          <div><label className="cz-lbl">Manipulación DTF ($/pieza)</label><input className="cz-in" type="number" value={configProduccion.manipPzaDTF} onChange={(e) => editarProduccion("manipPzaDTF", e.target.value)} /></div>
          <div><label className="cz-lbl">Hoja sublimación $/metro</label><input className="cz-in" type="number" value={configProduccion.subliMetro} onChange={(e) => editarProduccion("subliMetro", e.target.value)} /></div>
          <div><label className="cz-lbl">Área hoja sublimación (cm²)</label><input className="cz-in" type="number" value={configProduccion.subliArea} onChange={(e) => editarProduccion("subliArea", e.target.value)} /></div>
          <div></div>
          <div><label className="cz-lbl">Diseño sencillo (min)</label><input className="cz-in" type="number" value={configProduccion.disenoSencilloMin} onChange={(e) => editarProduccion("disenoSencilloMin", e.target.value)} /></div>
          <div><label className="cz-lbl">Diseño complejo (min)</label><input className="cz-in" type="number" value={configProduccion.disenoComplejoMin} onChange={(e) => editarProduccion("disenoComplejoMin", e.target.value)} /></div>
          <div><label className="cz-lbl">IVA textil (catálogo Óptima)</label><input className="cz-in" type="number" step="0.01" value={configProduccion.ivaTextil} onChange={(e) => editarProduccion("ivaTextil", e.target.value)} /></div>
        </div>
        <div className="insumo-mod" style={{ marginTop: 8 }}>Mod: {configProduccion.mod}</div>
      </div>

      <div className="cz-card">
        <span className="cz-d" style={{ fontSize: 18, fontWeight: 700, textTransform: "uppercase" }}>Otros productos Óptima (Gorras y Termos)</span>
        <div style={{ fontSize: 11, color: "#7B8290", marginTop: 4 }}>Costo de mayoreo, sin IVA — mismo costo en todos los colores. Ya están conectados a Cotizar (pestañas 🧢 Gorras / 🥤 Termos), el margen se aplica automático según el tipo de cliente. Agrega variantes de color con un circulito o una foto para poder elegir cuál cotizar.</div>
        {["gorras", "termos"].map((sub) => (
          <div key={sub} style={{ marginTop: 12 }}>
            <div style={{ fontSize: 11, fontWeight: 700, color: "#7B8290", textTransform: "uppercase", letterSpacing: ".05em" }}>{sub}</div>
            <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fill, minmax(230px, 1fr))", gap: 6, marginTop: 6 }}>
              {catalogoOtros[sub].map((o) => (
                <div key={o.id} style={{ border: "1px solid #EEF0F2", borderRadius: 8, padding: 8, fontSize: 12 }}>
                  <div style={{ display: "flex", gap: 4, alignItems: "center", flexWrap: "wrap" }}>
                    <FavImg favorito={o.favorito} imagen={o.imagen} size={22} onToggleFav={() => toggleFavoritoOtro(sub, o.id)} onSubirImagen={(f) => subirImagenOtro(sub, o.id, f)} />
                    <span style={{ flex: 1 }}>{o.nombre}</span>
                    <input className="cz-in" style={{ width: 66, padding: "4px 6px", fontSize: 12 }} type="number" value={o.precio} onChange={(e) => actualizarOtro(sub, o.id, e.target.value)} />
                    <CalcLote unidad="pieza" onAplicar={(v) => actualizarOtro(sub, o.id, v)} />
                  </div>
                  <ColorVariantes colores={o.colores || []} onAgregar={(c) => agregarColorOtro(sub, o.id, c)} onQuitar={(cid) => quitarColorOtro(sub, o.id, cid)} />
                </div>
              ))}
            </div>
          </div>
        ))}
      </div>

      <div className="cz-card">
        <span className="cz-d" style={{ fontSize: 18, fontWeight: 700, textTransform: "uppercase" }}>Costos operativos generales (mensual)</span>
        <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr 1fr 1fr 1fr", gap: 8, marginTop: 10 }}>
          <div><label className="cz-lbl">Renta</label><input className="cz-in" type="number" value={costosOperativos.renta} onChange={(e) => editarOperativos("renta", e.target.value)} /></div>
          <div><label className="cz-lbl">Luz</label><input className="cz-in" type="number" value={costosOperativos.luz} onChange={(e) => editarOperativos("luz", e.target.value)} /></div>
          <div><label className="cz-lbl">Agua</label><input className="cz-in" type="number" value={costosOperativos.agua} onChange={(e) => editarOperativos("agua", e.target.value)} /></div>
          <div><label className="cz-lbl">Internet</label><input className="cz-in" type="number" value={costosOperativos.internet} onChange={(e) => editarOperativos("internet", e.target.value)} /></div>
          <div><label className="cz-lbl">Gasolina</label><input className="cz-in" type="number" value={costosOperativos.gasolina} onChange={(e) => editarOperativos("gasolina", e.target.value)} /></div>
        </div>
        <div style={{ fontSize: 12, color: "#7B8290", marginTop: 10 }}>Total mensual: <b>{fmt(totalOperativoMensual)}</b> · Costo por hora (÷{HOURS_PER_MONTH}h): <b>{fmt(costosPorHora.generalPorHora)}</b></div>
        <div className="insumo-mod" style={{ marginTop: 4 }}>Mod: {costosOperativos.mod}</div>
      </div>

      <div className="cz-card">
        <span className="cz-d" style={{ fontSize: 18, fontWeight: 700, textTransform: "uppercase" }}>Costo por máquina (mensual)</span>
        <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 8, marginTop: 10 }}>
          <div><label className="cz-lbl">CNC / Láser</label><input className="cz-in" type="number" value={costoMaquinas.cnc} onChange={(e) => editarMaquinas("cnc", e.target.value)} /></div>
          <div><label className="cz-lbl">Impresora 3D (amortizada)</label><input className="cz-in" type="number" value={costoMaquinas.impresora3d} onChange={(e) => editarMaquinas("impresora3d", e.target.value)} /></div>
        </div>
        <div style={{ fontSize: 12, color: "#7B8290", marginTop: 10 }}>CNC/Láser por hora: <b>{fmt(costosPorHora.cncPorHora)}</b> · Impresora 3D por hora: <b>{fmt(costosPorHora.impresora3dPorHora)}</b></div>
        <div className="insumo-mod" style={{ marginTop: 4 }}>Mod: {costoMaquinas.mod}</div>
      </div>

      <div className="cz-card">
        <span className="cz-d" style={{ fontSize: 18, fontWeight: 700, textTransform: "uppercase" }}>Mano de obra</span>
        <div style={{ maxWidth: 220, marginTop: 10 }}>
          <label className="cz-lbl">Tarifa por hora ($)</label>
          <input className="cz-in" type="number" value={manoObra.tarifaHr} onChange={(e) => editarManoObra("tarifaHr", e.target.value)} />
        </div>
        <div className="insumo-mod" style={{ marginTop: 8 }}>Mod: {manoObra.mod}</div>
      </div>
    </div>
  );
}

/* ===================== CONFIG ===================== */
function VistaConfig({ mults, setMults, modoMargen, setModoMargen }) {
  return (
    <div style={{ maxWidth: 540, display: "flex", flexDirection: "column", gap: 14 }}>
      <div className="cz-card">
        <span className="cz-d" style={{ fontSize: 18, fontWeight: 700, textTransform: "uppercase" }}>Tipo de margen</span>
        <div style={{ display: "flex", gap: 8, marginTop: 10 }}>
          <div className={"tierbox" + (modoMargen === "markup" ? " on" : "")} onClick={() => setModoMargen("markup")}><b>Markup sobre costo</b><div className="cz-m" style={{ fontSize: 11, color: "#7B8290" }}>costo × (1+%)</div></div>
          <div className={"tierbox" + (modoMargen === "venta" ? " on" : "")} onClick={() => setModoMargen("venta")}><b>Margen sobre venta</b><div className="cz-m" style={{ fontSize: 11, color: "#7B8290" }}>costo ÷ (1−%)</div></div>
        </div>
      </div>
      <div className="cz-card">
        <span className="cz-d" style={{ fontSize: 18, fontWeight: 700, textTransform: "uppercase" }}>Ganancia por tier</span>
        {Object.keys(mults).map((t) => (
          <div key={t} style={{ marginTop: 14 }}>
            <div style={{ display: "flex", justifyContent: "space-between" }}><span style={{ fontSize: 14, fontWeight: 600 }}>{t}</span><span className="cz-m" style={{ fontWeight: 600 }}>{Math.round(mults[t] * 100)}%</span></div>
            <input type="range" min="0" max="1" step="0.01" value={mults[t]} style={{ width: "100%", accentColor: "#F4561D" }} onChange={(e) => setMults({ ...mults, [t]: Number(e.target.value) })} />
          </div>
        ))}
      </div>
    </div>
  );
}

/* ===================== APP ===================== */
function App() {
  const [tab, setTab] = useState("cotizar");
  const [mults, setMults] = useState(() => {
    const cargado = loadLS("cz_mults", { ...TIERS });
    if (cargado["Sin margen"] === undefined) cargado["Sin margen"] = 0;
    return cargado;
  });
  const [modoMargen, setModoMargen] = useState(() => loadLS("cz_modoMargen", "markup"));
  const [clientes, setClientes] = useState(() => loadLS("cz_clientes", []));
  const [historial, setHistorial] = useState(() => loadLS("cz_historial", []));
  const [materiales, setMateriales] = useState(() => {
    const cargado = loadLS("cz_materiales", DEFAULT_MATERIALES);
    if (!cargado.dtf || !cargado.dtf.some((m) => m.tipo === "escalonado")) cargado.dtf = DEFAULT_MATERIALES.dtf;
    if (!cargado.empaque) cargado.empaque = DEFAULT_MATERIALES.empaque;
    if (cargado.dtf.some((m) => m.id === "tote-negra" || m.id === "tote-cafe")) cargado.dtf = cargado.dtf.filter((m) => m.id !== "tote-negra" && m.id !== "tote-cafe");
    return cargado;
  });
  const [preciosFijos, setPreciosFijos] = useState(() => {
    const cargado = { ...DEFAULT_PRECIOS_FIJOS, ...loadLS("cz_preciosFijos", DEFAULT_PRECIOS_FIJOS) };
    if (cargado.totebags && cargado.totebags.some((t) => t.precioPz !== undefined)) {
      cargado.totebags = cargado.totebags.map((t) => {
        if (t.precioPz === undefined) return t;
        const { precioPz, ...resto } = t;
        return { ...resto, costoPz: Math.round((precioPz / 1.65) * 100) / 100 };
      });
    }
    return cargado;
  });
  const [configProduccion, setConfigProduccion] = useState(() => ({ ...DEFAULT_CONFIG_PRODUCCION, ...loadLS("cz_configProduccion", DEFAULT_CONFIG_PRODUCCION) }));
  const [costosOperativos, setCostosOperativos] = useState(() => loadLS("cz_costosOperativos", DEFAULT_COSTOS_OPERATIVOS));
  const [costoMaquinas, setCostoMaquinas] = useState(() => loadLS("cz_costoMaquinas", DEFAULT_COSTO_MAQUINAS));
  const [manoObra, setManoObra] = useState(() => loadLS("cz_manoObra", DEFAULT_MANO_OBRA));
  const [catalogoOtros, setCatalogoOtros] = useState(() => loadLS("cz_catalogoOtros", DEFAULT_CATALOGO_OTROS));
  const [productosLab, setProductosLab] = useState(() => loadLS("cz_productosLab", []));

  useEffect(() => saveLS("cz_catalogoOtros", catalogoOtros), [catalogoOtros]);
  useEffect(() => saveLS("cz_productosLab", productosLab), [productosLab]);
  useEffect(() => {
    const onStorage = (e) => {
      if (e.key === "cz_productosLab") setProductosLab(loadLS("cz_productosLab", []));
    };
    window.addEventListener("storage", onStorage);
    return () => window.removeEventListener("storage", onStorage);
  }, []);
  useEffect(() => {
    if (tab === "lab") setProductosLab(loadLS("cz_productosLab", []));
  }, [tab]);
  useEffect(() => saveLS("cz_mults", mults), [mults]);
  useEffect(() => saveLS("cz_modoMargen", modoMargen), [modoMargen]);
  useEffect(() => saveLS("cz_clientes", clientes), [clientes]);
  useEffect(() => saveLS("cz_historial", historial), [historial]);
  useEffect(() => saveLS("cz_materiales", materiales), [materiales]);
  useEffect(() => saveLS("cz_preciosFijos", preciosFijos), [preciosFijos]);
  useEffect(() => saveLS("cz_configProduccion", configProduccion), [configProduccion]);
  useEffect(() => saveLS("cz_costosOperativos", costosOperativos), [costosOperativos]);
  useEffect(() => saveLS("cz_costoMaquinas", costoMaquinas), [costoMaquinas]);
  useEffect(() => saveLS("cz_manoObra", manoObra), [manoObra]);

  const costosPorHora = useMemo(() => {
    const generalMensual = costosOperativos.renta + costosOperativos.luz + costosOperativos.agua + costosOperativos.internet + costosOperativos.gasolina;
    return {
      generalPorHora: generalMensual / HOURS_PER_MONTH,
      cncPorHora: costoMaquinas.cnc / HOURS_PER_MONTH,
      impresora3dPorHora: costoMaquinas.impresora3d / HOURS_PER_MONTH,
    };
  }, [costosOperativos, costoMaquinas]);

  const insumos = { materiales, preciosFijos, configProduccion, costosPorHora, manoObra, productosLab, catalogoOtros };

  const eliminarProductoLab = (id) => { if (confirm("¿Eliminar este producto de Studio Lab?")) setProductosLab((prev) => prev.filter((p) => p.id !== id)); };
  const agregarColorProductoLab = (id, color) => setProductosLab((prev) => prev.map((p) => (p.id === id ? { ...p, variantes: [...(p.variantes || []), color] } : p)));
  const quitarColorProductoLab = (id, colorId) => setProductosLab((prev) => prev.map((p) => (p.id === id ? { ...p, variantes: (p.variantes || []).filter((c) => c.id !== colorId) } : p)));

  const agregarHistorial = (entry) => setHistorial((prev) => [entry, ...prev]);
  const eliminarHistorial = (id) => setHistorial((prev) => prev.filter((h) => h.id !== id));
  const limpiarHistorial = () => { if (confirm("¿Eliminar todo el historial?")) setHistorial([]); };

  const agregarCliente = (c) => setClientes((prev) => [...prev, c]);
  const eliminarCliente = (id) => { if (confirm("¿Eliminar este cliente?")) setClientes((prev) => prev.filter((c) => c.id !== id)); };

  const tabs = [
    ["cotizar", "⚡ Cotizar"],
    ["inversa", "🔄 Inversa"],
    ["clientes", "👥 Clientes"],
    ["lab", "🧪 Studio Lab"],
    ["historial", "🕐 Historial"],
    ["insumos", "📦 Insumos"],
    ["config", "⚙ Config"],
  ];

  return (
    <div className="cz">
      <style>{css}</style>
      <div className="cz-nav">
        <span className="cz-d" style={{ fontSize: 19, fontWeight: 700, color: "#fff", padding: "0 10px 0 4px", whiteSpace: "nowrap" }}>MRCH<span style={{ color: "#F4561D" }}>·</span>COTIZA</span>
        {tabs.map(([k, t]) => <button key={k} className={"cz-tab" + (tab === k ? " on" : "")} onClick={() => setTab(k)}>{t}</button>)}
        <a className="cz-extra" href="/">🏠 Inicio</a>
        <a className="cz-extra" href="herreria.html">🔧 Herrería</a>
        <a className="cz-extra" href="/comparar.html">📊 Comparar</a>
      </div>
      <div style={{ maxWidth: 1060, margin: "0 auto", padding: 16 }}>
        {tab === "cotizar" && <VistaCotizar mults={mults} modoMargen={modoMargen} clientes={clientes} onGuardarHistorial={agregarHistorial} insumos={insumos} />}
        {tab === "inversa" && <VistaInversa mults={mults} modoMargen={modoMargen} />}
        {tab === "clientes" && <VistaClientes clientes={clientes} onAgregar={agregarCliente} onEliminar={eliminarCliente} />}
        {tab === "lab" && <VistaLab productosLab={productosLab} onEliminar={eliminarProductoLab} onAgregarColor={agregarColorProductoLab} onQuitarColor={quitarColorProductoLab} />}
        {tab === "historial" && <VistaHistorial historial={historial} onEliminar={eliminarHistorial} onLimpiar={limpiarHistorial} />}
        {tab === "insumos" && (
          <VistaInsumos
            materiales={materiales} setMateriales={setMateriales}
            preciosFijos={preciosFijos} setPreciosFijos={setPreciosFijos}
            configProduccion={configProduccion} setConfigProduccion={setConfigProduccion}
            costosOperativos={costosOperativos} setCostosOperativos={setCostosOperativos}
            costoMaquinas={costoMaquinas} setCostoMaquinas={setCostoMaquinas}
            manoObra={manoObra} setManoObra={setManoObra}
            costosPorHora={costosPorHora}
            catalogoOtros={catalogoOtros} setCatalogoOtros={setCatalogoOtros}
          />
        )}
        {tab === "config" && <VistaConfig mults={mults} setMults={setMults} modoMargen={modoMargen} setModoMargen={setModoMargen} />}
      </div>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
</script>
<script>
(function () {
  var code = document.getElementById("app-source").textContent;
  var output = Babel.transform(code, { presets: [["react", { runtime: "classic" }]] }).code;
  var script = document.createElement("script");
  script.textContent = output;
  document.body.appendChild(script);
})();
</script>
</body>
</html>
