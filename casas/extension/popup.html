<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<style>
  body { font-family: 'Segoe UI', system-ui, sans-serif; width: 320px; margin: 0; padding: 16px; background: #14161D; color: #fff; }
  h1 { font-size: 16px; margin: 0 0 12px; }
  label { display: block; font-size: 12px; color: #9AA0AE; margin: 10px 0 4px; }
  input { width: 100%; box-sizing: border-box; padding: 8px; border-radius: 8px; border: 1px solid #333846; background: #1E2129; color: #fff; font-size: 12px; }
  .row { display: flex; gap: 8px; margin-top: 14px; }
  button, a.btn { flex: 1; padding: 9px; border: 0; border-radius: 8px; font-weight: 700; font-size: 12px; cursor: pointer; text-align: center; text-decoration: none; }
  .pri { background: #F4561D; color: #fff; }
  .sec { background: #2A2E3A; color: #fff; }
  #estado { font-size: 12px; margin-top: 12px; min-height: 16px; color: #9AA0AE; }
  .ok { color: #4ADE80 !important; } .err { color: #F87171 !important; }
</style>
</head>
<body>
  <h1>🏠 Casas → Google Sheet</h1>
  <label for="url">URL del Apps Script (termina en /exec)</label>
  <input id="url" placeholder="https://script.google.com/macros/s/…/exec">
  <label for="token">Código secreto (menú 🏠 Casas → Ver código)</label>
  <input id="token" placeholder="ej. k3f9…">
  <div class="row">
    <button class="pri" id="guardar">Guardar</button>
    <button class="sec" id="probar">Probar conexión</button>
  </div>
  <div class="row"><a class="btn sec" id="sheet" target="_blank" style="display:none">Abrir el Sheet</a></div>
  <div id="estado"></div>
  <script src="popup.js"></script>
</body>
</html>
