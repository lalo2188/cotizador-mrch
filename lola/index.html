<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lola · Herramientas</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background: #1B0F2E;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .wrap { max-width: 640px; width: 100%; }
  .top { text-align: center; margin-bottom: 30px; color: #fff; }
  .top .back { display: inline-block; margin-bottom: 18px; font-size: 12px; color: #C4B5FD; text-decoration: none; border: 1px solid #4C2E7A; border-radius: 20px; padding: 6px 14px; }
  .top .back:hover { color: #fff; border-color: #A855F7; }
  .top h1 { font-size: 2em; font-weight: 700; }
  .top p { color: #C4B5FD; font-size: 14px; margin-top: 8px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 18px; }
  .card {
    background: linear-gradient(135deg, #A855F7 0%, #6D28D9 100%);
    border-radius: 16px;
    padding: 28px 22px;
    text-decoration: none;
    color: #fff;
    display: block;
    box-shadow: 0 8px 24px rgba(0,0,0,0.3);
    transition: transform .2s ease, box-shadow .2s ease;
  }
  .card:hover { transform: translateY(-4px); box-shadow: 0 14px 30px rgba(0,0,0,0.4); }
  .card .icon { font-size: 36px; display: block; margin-bottom: 10px; }
  .card h2 { font-size: 1.2em; font-weight: 700; }
  .card p { font-size: 13px; opacity: .85; margin-top: 6px; line-height: 1.5; }
  .soon { border: 1px dashed #4C2E7A; background: transparent; opacity: .6; }
  .soon:hover { transform: none; box-shadow: none; }
  .footer { text-align: center; color: #6B4C93; font-size: 12px; margin-top: 28px; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="top">
      <a class="back" href="/">← Inicio</a>
      <h1>🎀 Lola</h1>
      <p>Herramientas disponibles</p>
    </div>
    <div class="grid">
      <a class="card" href="/comparar.html">
        <span class="icon">📊</span>
        <h2>Comparar</h2>
        <p>Compara precios unitarios entre varias opciones, con soporte para ml/L y g/kg.</p>
      </a>
      <div class="card soon">
        <span class="icon">✨</span>
        <h2>Próximamente</h2>
        <p>Aquí irán agregándose más herramientas para Lola.</p>
      </div>
    </div>
    <div class="footer">Lola · Herramientas internas</div>
  </div>
</body>
</html>
