<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#14161D">
<title>Quisito · Pedidos</title>
<meta name="description" content="Alta e impresión de pedidos de Quisito">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Segoe+UI&display=swap">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, 'Segoe UI', Roboto, sans-serif;
    background: #14161D; color: #E7E8EC; min-height: 100vh; padding-bottom: 40px;
  }
  .d { font-family: 'Barlow Condensed', sans-serif; letter-spacing: .04em; }
  .m { font-family: 'IBM Plex Mono', monospace; }

  .nav {
    background: #1B1E28; display: flex; align-items: center; gap: 10px;
    padding: 14px 18px; position: sticky; top: 0; z-index: 20; border-bottom: 1px solid #2A2E3A;
  }
  .nav a { color: #9AA0AE; text-decoration: none; font-size: 13px; font-weight: 600; }
  .nav a:hover { color: #fff; }
  .nav .titulo { font-family: 'Barlow Condensed', sans-serif; font-size: 20px; font-weight: 700; color: #fff; margin-left: 6px; }
  .nav .titulo b { color: #A855F7; }

  .tabs { display: flex; gap: 8px; padding: 14px 18px 0; max-width: 640px; margin: 0 auto; }
  .tab {
    flex: 1; background: #1B1E28; border: 1.5px solid #2A2E3A; color: #9AA0AE;
    border-radius: 10px; padding: 11px; font-weight: 700; font-size: 13.5px; cursor: pointer;
    font-family: 'Barlow Condensed', sans-serif; letter-spacing: .04em; text-transform: uppercase;
  }
  .tab.on { background: #A855F7; border-color: #A855F7; color: #fff; }
  .tab .n { display: inline-block; background: rgba(255,255,255,.22); border-radius: 999px; padding: 1px 7px; font-size: 11px; margin-left: 6px; }

  main { max-width: 640px; margin: 0 auto; padding: 16px 18px 0; }
  .vista { display: none; } .vista.on { display: block; }

  .card { background: #1B1E28; border: 1px solid #2A2E3A; border-radius: 12px; padding: 16px; margin-bottom: 12px; }
  .lbl { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .07em; color: #8A90A0; margin-bottom: 5px; display: block; }
  .in {
    width: 100%; border: 1.5px solid #2A2E3A; border-radius: 8px; padding: 10px 11px;
    font-size: 15px; background: #14161D; color: #E7E8EC; font-family: inherit;
  }
  .in:focus { outline: none; border-color: #A855F7; }
  textarea.in { min-height: 90px; resize: vertical; font-family: 'IBM Plex Mono', monospace; font-size: 13.5px; }
  .par { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .campo { margin-bottom: 12px; }

  .seg { display: flex; gap: 8px; }
  .seg > div {
    flex: 1; border: 1.5px solid #2A2E3A; border-radius: 9px; padding: 10px; text-align: center;
    cursor: pointer; font-size: 13.5px; font-weight: 600; color: #9AA0AE; background: #14161D;
  }
  .seg > div.on { border-color: #A855F7; background: #A855F71a; color: #fff; }

  .btn {
    background: #2A2E3A; color: #fff; border: none; border-radius: 9px; padding: 12px 16px;
    font-weight: 700; cursor: pointer; font-size: 14px; font-family: inherit;
  }
  .btn.morado { background: #A855F7; }
  .btn.ancho { width: 100%; }
  .btn:disabled { opacity: .4; cursor: not-allowed; }
  .btn.chico { padding: 8px 12px; font-size: 12.5px; }
  .btn.rojo { background: transparent; color: #F87171; border: 1px solid #F8717155; }

  .pedido {
    background: #1B1E28; border: 1px solid #2A2E3A; border-radius: 12px; padding: 14px; margin-bottom: 10px;
  }
  .pedido.impreso { opacity: .6; }
  .pedido .fila-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
  .pedido .folio { font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: #8A90A0; }
  .pedido .cliente { font-weight: 700; font-size: 16px; margin-top: 2px; }
  .pedido .meta { font-size: 12.5px; color: #9AA0AE; margin-top: 4px; line-height: 1.5; }
  .pedido .total { font-family: 'IBM Plex Mono', monospace; font-weight: 700; font-size: 16px; white-space: nowrap; }
  .pedido .acciones { display: flex; gap: 6px; margin-top: 12px; flex-wrap: wrap; }
  .estado {
    display: inline-block; font-size: 10.5px; font-weight: 700; text-transform: uppercase;
    letter-spacing: .05em; padding: 2px 8px; border-radius: 999px; margin-top: 6px;
  }
  .estado.pendiente { background: #F4561D22; color: #F4561D; }
  .estado.impreso-e { background: #0FA3B122; color: #0FA3B1; }
  .estado.entregado { background: #2EA84F22; color: #2EA84F; }

  .vacio { text-align: center; color: #6B7180; padding: 40px 16px; font-size: 14px; }

  .aviso {
    position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%);
    background: #2A2E3A; color: #fff; padding: 12px 18px; border-radius: 999px;
    font-size: 13.5px; box-shadow: 0 8px 24px rgba(0,0,0,.4); z-index: 50; max-width: 90vw;
  }
  .aviso.mal { background: #7F1D1D; }
  .aviso.ok { background: #14532D; }

  /* -------------------------------------------------- ticket en vivo, a un lado */
  .form-grid { display: grid; grid-template-columns: 1.15fr .85fr; gap: 16px; align-items: start; }
  .ticket-panel { position: sticky; top: 76px; }
  @media (max-width: 760px) {
    .form-grid { grid-template-columns: 1fr; }
    .ticket-panel { position: static; }
  }
  .ticket-panel .etiqueta { font-family: 'Barlow Condensed', sans-serif; font-size: 13px; color: #9AA0AE; margin-bottom: 8px; text-transform: uppercase; letter-spacing: .06em; }
  .ticket-paper {
    background: #fff; color: #111; font-family: 'IBM Plex Mono', monospace; font-size: 12.5px;
    padding: 16px 14px 22px; border-radius: 2px; line-height: 1.55;
    -webkit-mask: radial-gradient(circle at 8px 100%, transparent 7px, #000 7.5px) -8px 0/16px 100%;
    mask: radial-gradient(circle at 8px 100%, transparent 7px, #000 7.5px) -8px 0/16px 100%;
  }
  .tk-titulo { text-align: center; font-weight: 700; font-size: 15px; margin: 2px 0 4px; }
  .tk-linea { white-space: pre; }
  .tk-centro { text-align: center; }
  .tk-derecha { text-align: right; }
  .tk-sep { border-top: 1px dashed #999; margin: 7px 0; }
  .tk-espacio { height: 12px; }
</style>
</head>
<body>

<div class="nav">
  <a href="/lola/">← Lola</a>
  <span class="titulo">Quisito · <b>Pedidos</b></span>
</div>

<div class="tabs">
  <div class="tab on" data-v="nuevo">+ Nuevo pedido</div>
  <div class="tab" data-v="lista">Pendientes<span class="n" id="contador">0</span></div>
</div>

<main>

  <section class="vista on" id="v-nuevo">
    <div class="form-grid">
      <div class="card">
      <div class="par">
        <div class="campo">
          <label class="lbl">Folio</label>
          <input class="in m" id="f-folio">
        </div>
        <div class="campo">
          <label class="lbl">Fecha de entrega</label>
          <input class="in" id="f-fecha" type="date">
        </div>
      </div>

      <div class="campo">
        <label class="lbl">Cliente</label>
        <input class="in" id="f-cliente" placeholder="Nombre">
      </div>
      <div class="campo">
        <label class="lbl">Teléfono</label>
        <input class="in" id="f-tel" placeholder="33 1234 5678" inputmode="tel">
      </div>

      <div class="campo">
        <label class="lbl">Entrega</label>
        <div class="seg">
          <div id="lugar-tienda" class="on">Recoge en tienda</div>
          <div id="lugar-domicilio">A domicilio</div>
        </div>
      </div>
      <div class="campo" id="campo-domicilio" style="display:none">
        <label class="lbl">Domicilio</label>
        <input class="in" id="f-domicilio" placeholder="Calle, número, colonia...">
      </div>

      <div class="campo">
        <label class="lbl">Pedido</label>
        <textarea class="in" id="f-pedido" placeholder="1 pastel de vainilla 3 leches&#10;2 docenas de galletas decoradas&#10;..."></textarea>
      </div>
      <div class="campo">
        <label class="lbl">Notas (opcional)</label>
        <input class="in" id="f-notas" placeholder="Sin nuez, escribir 'Feliz cumple Ana'...">
      </div>

      <div class="par">
        <div class="campo">
          <label class="lbl">Total</label>
          <input class="in m" id="f-total" type="number" inputmode="decimal" placeholder="0.00">
        </div>
        <div class="campo">
          <label class="lbl">Anticipo</label>
          <input class="in m" id="f-anticipo" type="number" inputmode="decimal" placeholder="0.00">
        </div>
      </div>
      <div class="campo m" id="pendiente-preview" style="color:#9AA0AE;font-size:13px"></div>
      </div>

      <div class="ticket-panel">
        <div class="etiqueta">Así va a salir el papel</div>
        <div class="ticket-paper" id="ticket-paper"></div>
        <div style="display:flex;gap:8px;margin-top:10px">
          <button class="btn chico" id="btn-imprimir-vivo" style="flex:1">🖨 Imprimir</button>
          <button class="btn morado chico" id="btn-guardar" style="flex:1">Guardar</button>
        </div>
      </div>
    </div>
  </section>

  <section class="vista" id="v-lista">
    <div id="lista-pedidos"></div>
  </section>

</main>

<script>
const $ = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => [...(r || document).querySelectorAll(s)];

// El mismo puente que ya funciona para el cotizador de Lalo: mismo webhook, mismo token.
const IMPRIMIR_WEBHOOK = "https://n8n.lalocortes.com/webhook/cotizador-ticket";
const IMPRIMIR_TOKEN = "5a59d15f5e950ced17dfd6eb087303a4a23b5ed1"; // el mismo token que ya usas en el cotizador

const fmt = (n) => "$" + (Number(n) || 0).toLocaleString("es-MX", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const hoyISO = () => new Date().toISOString().slice(0, 10);
const fechaLegible = (iso) => {
  if (!iso) return "";
  const [y, m, d] = iso.split("-");
  return `${d}/${m}/${y}`;
};

function limpiarEmojis(s) {
  // La térmica no tiene emojis en su tabla de caracteres — salen como "??".
  // Importante aquí porque a veces se pega el pedido tal cual vino de WhatsApp,
  // donde cada línea suele empezar con un emoji como viñeta.
  return String(s || "")
    .split("\n")
    .map((linea) => linea
      .replace(/[\u{1F300}-\u{1FAFF}\u{2600}-\u{27BF}\u{2190}-\u{21FF}\u{2B00}-\u{2BFF}\u{FE0F}]/gu, "")
      .replace(/[ \t]{2,}/g, " ")
      .trim())
    .join("\n")
    .trim();
}

// ------------------------------------------------------------- almacenamiento
function cargarPedidos() {
  try { return JSON.parse(localStorage.getItem("quisito_pedidos") || "[]"); }
  catch (e) { return []; }
}
function guardarPedidos(lista) {
  localStorage.setItem("quisito_pedidos", JSON.stringify(lista));
}
function siguienteFolio() {
  const n = (Number(localStorage.getItem("quisito_folio_n")) || 0) + 1;
  localStorage.setItem("quisito_folio_n", n);
  return "Q-" + String(n).padStart(4, "0");
}

let pedidos = cargarPedidos();

// ------------------------------------------------------------------- avisos
let avisoTimer;
function aviso(texto, tipo) {
  $(".aviso")?.remove();
  const d = document.createElement("div");
  d.className = "aviso" + (tipo ? " " + tipo : "");
  d.textContent = texto;
  document.body.appendChild(d);
  clearTimeout(avisoTimer);
  avisoTimer = setTimeout(() => d.remove(), tipo === "mal" ? 5000 : 2600);
}

// --------------------------------------------------------------- navegación
function irA(v) {
  $$(".vista").forEach((s) => s.classList.toggle("on", s.id === "v-" + v));
  $$(".tab").forEach((t) => t.classList.toggle("on", t.dataset.v === v));
  if (v === "lista") pintarLista();
}
$$(".tab").forEach((t) => (t.onclick = () => irA(t.dataset.v)));

// ------------------------------------------------------------------- forma
$("#f-folio").value = siguienteFolio();
$("#f-fecha").value = hoyISO();

let esDomicilio = false;
$("#lugar-tienda").onclick = () => {
  esDomicilio = false;
  $("#lugar-tienda").classList.add("on");
  $("#lugar-domicilio").classList.remove("on");
  $("#campo-domicilio").style.display = "none";
  refrescarTicketLive();
};
$("#lugar-domicilio").onclick = () => {
  esDomicilio = true;
  $("#lugar-domicilio").classList.add("on");
  $("#lugar-tienda").classList.remove("on");
  $("#campo-domicilio").style.display = "block";
  refrescarTicketLive();
};

function actualizarPendientePreview() {
  const total = Number($("#f-total").value) || 0;
  const anticipo = Number($("#f-anticipo").value) || 0;
  if (!total) { $("#pendiente-preview").textContent = ""; return; }
  $("#pendiente-preview").textContent = anticipo > 0
    ? `Pendiente al entregar: ${fmt(total - anticipo)}`
    : "";
}

// Cualquier cambio en el formulario redibuja el ticket de la derecha al instante.
$$("#f-folio, #f-fecha, #f-cliente, #f-tel, #f-domicilio, #f-pedido, #f-notas, #f-total, #f-anticipo")
  .forEach((campo) => { campo.oninput = () => { actualizarPendientePreview(); refrescarTicketLive(); }; });

function limpiarForma() {
  $("#f-folio").value = siguienteFolio();
  $("#f-fecha").value = hoyISO();
  $("#f-cliente").value = "";
  $("#f-tel").value = "";
  $("#f-domicilio").value = "";
  $("#f-pedido").value = "";
  $("#f-notas").value = "";
  $("#f-total").value = "";
  $("#f-anticipo").value = "";
  $("#lugar-tienda").click();
  $("#pendiente-preview").textContent = "";
  delete $("#btn-guardar").dataset.editando;
  $("#btn-guardar").textContent = "Guardar pedido";
}

$("#btn-guardar").onclick = () => {
  const cliente = $("#f-cliente").value.trim();
  const pedido = $("#f-pedido").value.trim();
  if (!cliente) return aviso("Falta el nombre del cliente", "mal");
  if (!pedido) return aviso("Escribe qué lleva el pedido", "mal");

  const editandoId = $("#btn-guardar").dataset.editando;
  const datos = {
    id: editandoId ? Number(editandoId) : Date.now(),
    folio: $("#f-folio").value.trim() || "s/n",
    cliente,
    telefono: $("#f-tel").value.trim(),
    fechaEntrega: $("#f-fecha").value,
    lugarEntrega: esDomicilio ? "A domicilio" : "Recoge en tienda",
    domicilio: esDomicilio ? $("#f-domicilio").value.trim() : "",
    pedido,
    notas: $("#f-notas").value.trim(),
    total: Number($("#f-total").value) || 0,
    anticipo: Number($("#f-anticipo").value) || 0,
    estado: "pendiente",
    creado: new Date().toISOString(),
  };

  if (editandoId) {
    pedidos = pedidos.map((p) => (p.id === datos.id ? { ...p, ...datos, estado: p.estado } : p));
    aviso("Pedido actualizado");
  } else {
    pedidos.unshift(datos);
    aviso("Pedido guardado");
  }
  guardarPedidos(pedidos);
  limpiarForma();
  actualizarContador();
  irA("lista");
};

function actualizarContador() {
  const n = pedidos.filter((p) => p.estado !== "entregado").length;
  $("#contador").textContent = n;
}
actualizarContador();

// -------------------------------------------------------------------- lista
function pintarLista() {
  const cont = $("#lista-pedidos");
  const activos = pedidos.filter((p) => p.estado !== "entregado");
  const entregados = pedidos.filter((p) => p.estado === "entregado");

  if (!pedidos.length) {
    cont.innerHTML = '<div class="vacio">Todavía no hay pedidos.<br>Dalos de alta en "+ Nuevo pedido".</div>';
    return;
  }

  const tarjeta = (p) => {
    const estadoClase = p.estado === "entregado" ? "entregado" : p.estado === "impreso" ? "impreso-e" : "pendiente";
    const estadoTexto = p.estado === "entregado" ? "Entregado" : p.estado === "impreso" ? "Impreso" : "Pendiente";
    return `
      <div class="pedido ${p.estado === "entregado" ? "impreso" : ""}" data-id="${p.id}">
        <div class="fila-top">
          <div>
            <div class="folio">${esc(p.folio)}</div>
            <div class="cliente">${esc(p.cliente)}</div>
            <div class="meta">
              ${p.fechaEntrega ? fechaLegible(p.fechaEntrega) + " · " : ""}${esc(p.lugarEntrega)}
              ${p.telefono ? " · " + esc(p.telefono) : ""}
            </div>
          </div>
          <div class="total">${fmt(p.total)}</div>
        </div>
        <div class="meta" style="margin-top:8px;white-space:pre-wrap">${esc(p.pedido)}</div>
        <span class="estado ${estadoClase}">${estadoTexto}</span>
        <div class="acciones">
          <button class="btn morado chico" data-accion="imprimir">🖨 Imprimir</button>
          <button class="btn chico" data-accion="editar">Editar</button>
          ${p.estado !== "entregado"
            ? '<button class="btn chico" data-accion="entregado">Marcar entregado</button>'
            : '<button class="btn chico" data-accion="reabrir">Reabrir</button>'}
          <button class="btn rojo chico" data-accion="borrar">Eliminar</button>
        </div>
      </div>`;
  };

  cont.innerHTML = activos.map(tarjeta).join("") +
    (entregados.length
      ? '<div class="lbl" style="margin:18px 0 8px">Entregados</div>' + entregados.map(tarjeta).join("")
      : "");

  $$(".pedido").forEach((el) => {
    const id = Number(el.dataset.id);
    $$("[data-accion]", el).forEach((btn) => {
      btn.onclick = () => accionPedido(id, btn.dataset.accion);
    });
  });
}

function esc(s) {
  return String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
}

function accionPedido(id, accion) {
  const p = pedidos.find((x) => x.id === id);
  if (!p) return;

  if (accion === "borrar") {
    if (!confirm(`¿Eliminar el pedido de ${p.cliente}?`)) return;
    pedidos = pedidos.filter((x) => x.id !== id);
    guardarPedidos(pedidos);
    actualizarContador();
    pintarLista();
  } else if (accion === "entregado") {
    p.estado = "entregado";
    guardarPedidos(pedidos);
    actualizarContador();
    pintarLista();
  } else if (accion === "reabrir") {
    p.estado = "pendiente";
    guardarPedidos(pedidos);
    actualizarContador();
    pintarLista();
  } else if (accion === "editar") {
    $("#f-folio").value = p.folio;
    $("#f-fecha").value = p.fechaEntrega;
    $("#f-cliente").value = p.cliente;
    $("#f-tel").value = p.telefono;
    $("#f-pedido").value = p.pedido;
    $("#f-notas").value = p.notas;
    $("#f-total").value = p.total || "";
    $("#f-anticipo").value = p.anticipo || "";
    if (p.lugarEntrega === "A domicilio") { $("#f-domicilio").value = p.domicilio; $("#lugar-domicilio").click(); }
    else $("#lugar-tienda").click();
    actualizarPendientePreview();
    refrescarTicketLive();
    $("#btn-guardar").dataset.editando = id;
    $("#btn-guardar").textContent = "Guardar cambios";
    irA("nuevo");
  } else if (accion === "imprimir") {
    imprimirPedido(p);
  }
}

// -------------------------------------------------------- vista previa visual
// Mismo ancho que usa la impresora en papel de 58mm (fuente normal, 32 columnas),
// para que lo que se ve en pantalla sea igual a lo que sale en papel.
function envolver32(texto, ancho) {
  ancho = ancho || 32;
  const renglones = [];
  for (const parrafo of String(texto ?? "").split("\n")) {
    if (!parrafo.trim()) { renglones.push(""); continue; }
    let actual = "";
    for (const palabra of parrafo.split(/\s+/)) {
      if (palabra.length > ancho) {
        if (actual) { renglones.push(actual); actual = ""; }
        for (let i = 0; i < palabra.length; i += ancho) renglones.push(palabra.slice(i, i + ancho));
        actual = renglones.pop() ?? "";
        continue;
      }
      if ((actual + " " + palabra).trim().length > ancho) { renglones.push(actual.trim()); actual = palabra; }
      else actual = (actual + " " + palabra).trim();
    }
    if (actual) renglones.push(actual.trim());
  }
  return renglones;
}

function renderizarTicketHTML(bloques) {
  let html = "";
  for (const b of bloques) {
    if (b.tipo === "titulo") {
      html += `<div class="tk-titulo">${esc(b.texto)}</div>`;
    } else if (b.tipo === "texto") {
      const clase = "tk-" + (b.alinear || "izquierda");
      html += envolver32(b.texto).map((l) => `<div class="tk-linea ${clase}">${esc(l) || "&nbsp;"}</div>`).join("");
    } else if (b.tipo === "linea") {
      html += `<div class="tk-sep"></div>`;
    } else if (b.tipo === "espacio") {
      html += `<div class="tk-espacio"></div>`;
    }
  }
  return html;
}

/** Arma un pedido temporal con lo que hay ahorita en el formulario, sin guardarlo. */
function pedidoDesdeForma() {
  return {
    folio: $("#f-folio").value.trim() || "s/n",
    cliente: $("#f-cliente").value.trim() || "(sin nombre)",
    telefono: $("#f-tel").value.trim(),
    fechaEntrega: $("#f-fecha").value,
    lugarEntrega: esDomicilio ? "A domicilio" : "Recoge en tienda",
    domicilio: esDomicilio ? $("#f-domicilio").value.trim() : "",
    pedido: $("#f-pedido").value.trim() || "(sin especificar)",
    notas: $("#f-notas").value.trim(),
    total: Number($("#f-total").value) || 0,
    anticipo: Number($("#f-anticipo").value) || 0,
  };
}

/** Redibuja el ticket de la derecha con lo que hay ahorita en el formulario. */
function refrescarTicketLive() {
  $("#ticket-paper").innerHTML = renderizarTicketHTML(bloquesPedido(pedidoDesdeForma()));
}

$("#btn-imprimir-vivo").onclick = () => imprimirPedido(pedidoDesdeForma());

refrescarTicketLive();

function bloquesPedido(p) {
  const L = limpiarEmojis;
  const bloques = [
    { tipo: "texto", texto: "Todo es", alinear: "centro" },
    { tipo: "titulo", texto: "QUISITO", tamano: 2 },
    { tipo: "texto", texto: "food & bakery", alinear: "centro" },
    { tipo: "linea", caracter: "=" },
    { tipo: "texto", texto: `Folio: ${p.folio || "s/n"}` },
    { tipo: "linea" },
    { tipo: "texto", texto: `Cliente: ${L(p.cliente)}` },
  ];
  if (p.telefono) bloques.push({ tipo: "texto", texto: `Tel: ${p.telefono}` });
  bloques.push({ tipo: "texto", texto: `Entrega: ${fechaLegible(p.fechaEntrega)}` });
  bloques.push({ tipo: "texto", texto: `Lugar: ${p.lugarEntrega}` });
  if (p.domicilio) bloques.push({ tipo: "texto", texto: `Domicilio: ${L(p.domicilio)}` });
  bloques.push({ tipo: "linea" });
  bloques.push({ tipo: "texto", texto: "Pedido:" });
  bloques.push({ tipo: "texto", texto: L(p.pedido) });
  if (p.notas) {
    bloques.push({ tipo: "espacio", lineas: 1 });
    bloques.push({ tipo: "texto", texto: "Notas:" });
    bloques.push({ tipo: "texto", texto: L(p.notas) });
  }
  bloques.push({ tipo: "linea" });
  bloques.push({ tipo: "titulo", texto: `TOTAL: ${fmt(p.total)}`, tamano: 2 });
  if (p.anticipo > 0) {
    bloques.push({ tipo: "texto", texto: `Anticipo: ${fmt(p.anticipo)}` });
    bloques.push({ tipo: "texto", texto: `Pendiente: ${fmt(p.total - p.anticipo)}` });
  }
  bloques.push({ tipo: "linea" });
  bloques.push({ tipo: "texto", texto: "Gracias Gracias Gracias", alinear: "centro" });
  bloques.push({ tipo: "espacio", lineas: 1 });
  bloques.push({ tipo: "texto", texto: "71427321893 • 54121381948", alinear: "centro" });
  return bloques;
}

async function imprimirPedido(p) {
  try {
    const r = await fetch(IMPRIMIR_WEBHOOK, {
      method: "POST",
      headers: { "Content-Type": "application/json", "X-Cotizador-Key": IMPRIMIR_TOKEN },
      body: JSON.stringify({ papel: 58, nombre: p.folio, bloques: bloquesPedido(p) }),
    });
    if (!r.ok) throw new Error(`Error ${r.status}`);
    if (p.estado === "pendiente") { p.estado = "impreso"; guardarPedidos(pedidos); }
    aviso("Ticket enviado a imprimir ✓", "ok");
    pintarLista();
  } catch (e) {
    aviso("No se pudo imprimir: " + e.message, "mal");
  }
}

pintarLista();
</script>
